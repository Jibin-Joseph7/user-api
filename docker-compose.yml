services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: user_api
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-prootpass", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: .
    restart: on-failure
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DATABASE_URL: root:rootpass@tcp(db:3306)/user_api?parseTime=true
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data: